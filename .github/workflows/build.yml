
name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Validate Website
        run: |
          test -f index.html
          test -f Dockerfile
          grep -qi "<html" index.html
          echo "Validation successful!"


      - name: Build Docker Image
        run: |
          docker build -t boobesh2005/github-actions-docker-cicd-ec2:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

 
      - name: Push Docker Image
        run: |
          docker push boobesh2005/github-actions-docker-cicd-ec2:latest


      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl enable --now docker

            sudo docker pull boobesh2005/github-actions-docker-cicd-ec2:latest

            sudo docker rm -f html-website || true

            sudo docker run -d \
              --name html-website \
              --restart unless-stopped \
              -p 80:80 \
              boobesh2005/github-actions-docker-cicd-ec2:latest

      - name: Verify Website
        run: |
          for i in {1..12}; do
            if curl -fsS "http://${{ secrets.EC2_HOST }}/" > /dev/null; then
              echo "Website is accessible!"
              exit 0
            fi
            sleep 10
          done

          echo "Website verification failed!"
          exit 1
