name: Docker CI/CD Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: boobesh2005/github-actions-docker-cicd-ec2:build-${{ github.run_number }}

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: /home/ec2-user/website/

      - uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: build-${{ github.run_number }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TAG
          script: |
            cd /home/ec2-user/website
            export IMAGE_TAG="$TAG"
            sudo --preserve-env=IMAGE_TAG docker compose pull
            sudo --preserve-env=IMAGE_TAG docker compose up -d --remove-orphans
