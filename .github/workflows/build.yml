name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Validate website files
      - name: Validate Website
        run: |
          test -f index.html
          test -f Dockerfile
          grep -qi "<html" index.html
          echo "Website validation successful!"

      # 3. Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t boobesh2005/github-actions-docker-cicd-ec2:latest .

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Push image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push boobesh2005/github-actions-docker-cicd-ec2:latest

      # 6. Configure AWS IAM credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 7. Verify AWS authentication
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # 8. Find default VPC and subnet
      - name: Get Network
        id: network
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters Name=is-default,Values=true \
            --query 'Vpcs[0].VpcId' \
            --output text)

          if [ "$VPC_ID" = "None" ] || [ -z "$VPC_ID" ]; then
            echo "Default VPC not found in ap-south-1"
            exit 1
          fi

          SUBNET_ID=$(aws ec2 describe-subnets \
            --filters \
              Name=vpc-id,Values="$VPC_ID" \
              Name=default-for-az,Values=true \
            --query 'Subnets[0].SubnetId' \
            --output text)

          if [ "$SUBNET_ID" = "None" ] || [ -z "$SUBNET_ID" ]; then
            echo "Default subnet not found"
            exit 1
          fi

          echo "vpc_id=$VPC_ID" >> "$GITHUB_OUTPUT"
          echo "subnet_id=$SUBNET_ID" >> "$GITHUB_OUTPUT"

          echo "VPC: $VPC_ID"
          echo "Subnet: $SUBNET_ID"

      # 9. Create security group
      - name: Create Security Group
        id: sg
        env:
          VPC_ID: ${{ steps.network.outputs.vpc_id }}
        run: |
          SG_ID=$(aws ec2 create-security-group \
            --group-name "github-actions-${GITHUB_RUN_ID}" \
            --description "GitHub Actions website deployment" \
            --vpc-id "$VPC_ID" \
            --query 'GroupId' \
            --output text)

          # Allow public website traffic on port 80
          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 80 \
            --cidr 0.0.0.0/0

          # Demo only: SSH is open to the internet.
          # Restrict port 22 to trusted IPs for production.
          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr 0.0.0.0/0

          echo "sg_id=$SG_ID" >> "$GITHUB_OUTPUT"
          echo "Security group created: $SG_ID"

      # 10. Launch EC2 instance
      - name: Launch EC2
        id: ec2
        env:
          SG_ID: ${{ steps.sg.outputs.sg_id }}
          SUBNET_ID: ${{ steps.network.outputs.subnet_id }}
          KEY_NAME: mumbai
        run: |
          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id ami-08e3b3155fc937a94 \
            --instance-type t3.micro \
            --key-name "$KEY_NAME" \
            --network-interfaces \
              "DeviceIndex=0,SubnetId=$SUBNET_ID,Groups=$SG_ID,AssociatePublicIpAddress=true" \
            --tag-specifications \
              'ResourceType=instance,Tags=[{Key=Name,Value=github-actions-website}]' \
            --query 'Instances[0].InstanceId' \
            --output text)

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "EC2 instance created: $INSTANCE_ID"

          # Wait for EC2 to enter running state
          aws ec2 wait instance-running \
            --instance-ids "$INSTANCE_ID"

          # Detect the public IP automatically
          IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          if [ "$IP" = "None" ] || [ -z "$IP" ]; then
            echo "Could not retrieve EC2 public IP"
            exit 1
          fi

          echo "public_ip=$IP" >> "$GITHUB_OUTPUT"
          echo "EC2 public IP: $IP"

      # 11. Wait for SSH
      - name: Wait for SSH
        env:
          IP: ${{ steps.ec2.outputs.public_ip }}
        run: |
          for i in {1..30}; do
            if timeout 5 bash -c "</dev/tcp/$IP/22" 2>/dev/null; then
              echo "SSH is reachable"
              exit 0
            fi

            sleep 10
          done

          echo "SSH connection timed out"
          exit 1

      # 12. Deploy Docker image to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.ec2.outputs.public_ip }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 2m
          command_timeout: 5m
          script: |
            sudo dnf install -y docker
            sudo systemctl enable --now docker

            sudo docker pull boobesh2005/github-actions-docker-cicd-ec2:latest

            sudo docker rm -f html-website || true

            sudo docker run -d \
              --name html-website \
              --restart unless-stopped \
              -p 80:80 \
              boobesh2005/github-actions-docker-cicd-ec2:latest

            sudo docker ps

      # 13. Verify website
      - name: Verify Website
        env:
          IP: ${{ steps.ec2.outputs.public_ip }}
        run: |
          for i in {1..12}; do
            if curl -fsS "http://$IP/" > /dev/null; then
              echo "Website deployed successfully!"
              echo "Website URL: http://$IP/"
              exit 0
            fi

            sleep 10
          done

          echo "Website verification failed"
          exit 1

      # 14. Display deployment details
      - name: Deployment Details
        if: always()
        env:
          IP: ${{ steps.ec2.outputs.public_ip }}
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          echo "Instance ID: ${INSTANCE_ID:-Not created}"
          echo "Website URL: http://${IP:-Not available}/"
