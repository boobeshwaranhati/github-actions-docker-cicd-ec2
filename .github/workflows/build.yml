name: Docker CI/CD Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Image Tag
        id: version
        run: echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          docker build -t boobesh2005/github-actions-docker-cicd-ec2:$TAG .
          docker push boobesh2005/github-actions-docker-cicd-ec2:$TAG

      - name: Copy Compose File to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: /home/ec2-user/website/

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ steps.version.outputs.tag }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TAG
          script: |
            if ! command -v docker >/dev/null 2>&1; then
              sudo yum install -y docker
              sudo systemctl enable --now docker
            fi

            if ! sudo docker compose version >/dev/null 2>&1; then
              sudo yum install -y docker-compose-plugin
            fi

            cd /home/ec2-user/website
            export IMAGE_TAG="$TAG"

            sudo docker compose pull
            sudo docker compose down || true
            sudo docker compose up -d
