name: Docker CI/CD Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Image Tag
        id: version
        run: echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          docker build -t boobesh2005/github-actions-docker-cicd-ec2:$TAG .
          docker push boobesh2005/github-actions-docker-cicd-ec2:$TAG

      - name: Install Docker and Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 2m
          command_timeout: 5m
          script: |
            if ! command -v docker >/dev/null 2>&1; then
              sudo yum install -y docker
            fi

            sudo systemctl enable --now docker

            if ! sudo docker compose version >/dev/null 2>&1; then
              sudo mkdir -p /usr/local/lib/docker/cli-plugins

              sudo curl -fSL \
                https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
                -o /usr/local/lib/docker/cli-plugins/docker-compose

              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            fi

            sudo docker compose version

      - name: Copy Compose File to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: /home/ec2-user/website/

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          timeout: 2m
          command_timeout: 5m
          script: |
            cd /home/ec2-user/website

            export IMAGE_TAG="$IMAGE_TAG"

            sudo --preserve-env=IMAGE_TAG docker compose pull
            sudo --preserve-env=IMAGE_TAG docker compose up -d --remove-orphans
