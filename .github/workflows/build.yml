name: Docker CI/CD Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        env:
          TAG: build-${{ github.run_number }}
        run: |
          docker build -t boobesh2005/github-actions-docker-cicd-ec2:$TAG .
          docker push boobesh2005/github-actions-docker-cicd-ec2:$TAG

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: build-${{ github.run_number }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TAG
          script: |
            cd /home/ec2-user/website
            export IMAGE_TAG="$TAG"
            sudo --preserve-env=IMAGE_TAG docker compose pull
            sudo --preserve-env=IMAGE_TAG docker compose up -d --remove-orphans
