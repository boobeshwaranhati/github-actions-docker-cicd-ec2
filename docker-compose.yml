services:
  website:
    image: boobesh2005/github-actions-docker-cicd-ec2:${IMAGE_TAG}
    container_name: html-website
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - website

volumes:
  caddy_data:
  caddy_config:
