services:
  website:
    image: boobesh2005/github-actions-docker-cicd-ec2:${IMAGE_TAG}
    container_name: html-website
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: yourdomain.com
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command:
      - /bin/sh
      - -c
      - |
        printf '%s {
          reverse_proxy website:80
        }\n' "$$DOMAIN" > /etc/caddy/Caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

volumes:
  caddy_data:
  caddy_config:
